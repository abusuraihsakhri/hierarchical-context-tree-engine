[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-context-tree-engine"
version = "2.0.0"
description = "HierarchicalContext-Tree: Multi-Tier Token Buffer & Recency Pyramid Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.100,<1", "uvicorn>=0.23,<1"]
test = ["pytest>=7,<10", "httpx>=0.25,<1"]

[project.scripts]
hierarchical-context-tree-engine = "context_tree.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/hierarchical-context-tree-engine"
Repository = "https://github.com/abusuraihsakhri/hierarchical-context-tree-engine.git"

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator", "context_tree_app"]

[tool.setuptools.packages.find]
include = ["agents*", "context_tree*"]
namespaces = false
